<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Credential Manager</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f7fa;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #1a202c;
      --muted: #718096;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #dc2626;
      --danger-hover: #b91c1c;
      --green: #16a34a;
      --sidebar-w: 180px;
      --topbar-h: 52px;
    }

    body { font-family: system-ui, -apple-system, sans-serif; font-size: 14px;
           background: var(--bg); color: var(--text); }

    /* ---- Setup screen ---- */
    .setup-card { display: flex; flex-direction: column; gap: 1rem; background: var(--surface);
                  border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,.1);
                  padding: 2rem; max-width: 380px; margin: 20vh auto; }
    .setup-card h1 { font-size: 1.3rem; }
    .setup-card input { padding: .55rem .75rem; border: 1px solid var(--border);
                        border-radius: 6px; font-size: 1rem; width: 100%; }
    .setup-card button { padding: .6rem; background: var(--primary); color: #fff;
                         border: none; border-radius: 6px; font-size: 1rem; cursor: pointer; }

    /* ---- Shell ---- */
    header#topbar { position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
                    background: var(--surface); border-bottom: 1px solid var(--border);
                    display: flex; align-items: center; justify-content: space-between;
                    padding: 0 1.25rem; z-index: 100; }
    .brand { font-weight: 600; font-size: 1rem; }
    .user-info { display: flex; align-items: center; gap: .6rem; color: var(--muted); font-size: .85rem; }

    .layout { display: flex; margin-top: var(--topbar-h); min-height: calc(100vh - var(--topbar-h)); }

    nav#sidebar { width: var(--sidebar-w); background: var(--surface);
                  border-right: 1px solid var(--border); padding: 1rem 0;
                  position: fixed; top: var(--topbar-h); bottom: 0; overflow-y: auto; }
    .nav-item { display: flex; align-items: center; gap: .5rem; padding: .6rem 1rem;
                color: var(--muted); cursor: pointer; border-radius: 4px; margin: 0 .5rem;
                text-decoration: none; user-select: none; }
    .nav-item:hover { background: var(--bg); color: var(--text); }
    .nav-item.active { background: #eff6ff; color: var(--primary); font-weight: 500; }

    main#main { flex: 1; margin-left: var(--sidebar-w); padding: 1.5rem 2rem; max-width: 1000px; }

    /* ---- Sections ---- */
    .section-header { display: flex; align-items: center; justify-content: space-between;
                      margin-bottom: 1rem; }
    .section-header h2 { font-size: 1.1rem; }

    /* ---- Table ---- */
    table { width: 100%; border-collapse: collapse; background: var(--surface);
            border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
    th, td { padding: .65rem 1rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { background: var(--bg); font-weight: 600; font-size: .8rem; text-transform: uppercase;
         color: var(--muted); letter-spacing: .04em; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafafa; }
    .empty { text-align: center; color: var(--muted); padding: 2rem; }
    .actions { display: flex; gap: .4rem; }
    .mono { font-family: monospace; font-size: .85rem; }

    /* ---- Buttons ---- */
    button { cursor: pointer; font-size: .85rem; border: none; border-radius: 5px;
             padding: .35rem .7rem; transition: background .15s; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-danger:hover:not(:disabled)  { background: var(--danger-hover); }
    .btn-sm      { padding: .25rem .6rem; font-size: .8rem; }
    .btn-ghost   { background: transparent; color: var(--muted); padding: .25rem .5rem; }
    .btn-ghost:hover { color: var(--text); background: var(--bg); }
    .btn-icon    { background: transparent; padding: .2rem .35rem; color: var(--muted); }
    .btn-icon:hover { color: var(--text); }

    /* ---- Badges ---- */
    .badge { display: inline-block; padding: .15rem .5rem; border-radius: 999px;
             font-size: .75rem; font-weight: 600; }
    .badge-locked   { background: #fee2e2; color: #991b1b; }
    .badge-unlocked { background: #d1fae5; color: #065f46; }
    #approval-badge { background: var(--primary); color: #fff; font-size: .7rem;
                      border-radius: 999px; padding: .1rem .45rem; }
    .hidden { display: none !important; }

    /* ---- SSE dot ---- */
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; }
    .dot-green { background: var(--green); }
    .dot-grey  { background: var(--muted); }

    /* ---- Countdown ---- */
    .countdown { font-size: .8rem; color: var(--muted); }

    /* ---- Secret ---- */
    .secret-mask { font-family: monospace; color: var(--muted); }

    /* ---- Modal ---- */
    #modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.4);
                     display: flex; align-items: center; justify-content: center; z-index: 200; }
    #modal-box { background: var(--surface); border-radius: 8px; padding: 1.5rem;
                 width: 100%; max-width: 460px; box-shadow: 0 8px 32px rgba(0,0,0,.2); }
    #modal-box h2 { font-size: 1.1rem; margin-bottom: 1.2rem; }
    #modal-box form { display: flex; flex-direction: column; gap: .85rem; }
    #modal-box label { display: flex; flex-direction: column; gap: .3rem;
                       font-size: .85rem; font-weight: 500; color: var(--muted); }
    #modal-box input { padding: .5rem .7rem; border: 1px solid var(--border);
                       border-radius: 5px; font-size: .9rem; color: var(--text); }
    #modal-box input:focus { outline: 2px solid var(--primary); border-color: transparent; }
    fieldset { border: 1px solid var(--border); border-radius: 6px; padding: .75rem; }
    legend { font-size: .8rem; font-weight: 600; color: var(--muted); padding: 0 .4rem; }
    .attr-row { display: flex; gap: .4rem; align-items: center; margin-bottom: .4rem; }
    .attr-row input { flex: 1; padding: .4rem .6rem; }
    .modal-actions { display: flex; justify-content: flex-end; gap: .6rem; margin-top: .5rem; }

    /* ---- Misc ---- */
    .loading, .error { padding: 2rem; text-align: center; color: var(--muted); }
    .error { color: var(--danger); }
  </style>
</head>
<body>
  <script src="bundle.js"></script>
</body>
</html>
